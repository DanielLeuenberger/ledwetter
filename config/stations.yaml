# ledwetter – station configuration
# All timestamps are measurement times reported by the sources (UTC). Records without one are discarded.
# All parameters a source delivers are stored in their original unit. Each source section may restrict
# them with shell-style patterns, e.g.
#   parameters: {include: ["tre*", "rre150z0"], exclude: ["tso*"]}
# 'python -m ledwetter stations --canton ZH' (or ZH,AG,...) writes a complete list of all stations in the canton(s).
# 'canton' on a section or a station is stored as station metadata (used by the canton filter of the web interface).

settings:
  user_agent: ledwetter/0.1 (private use)
  timeout_seconds: 120
  request_delay_seconds: 0.2      # pause between requests; spares the servers during backfills
  db_file: "data/ledwetter.db"

