[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledwetter"
version = "0.1.0"
description = "Collect, store and visualise measurements from public weather stations in Switzerland"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "requests>=2.28", "pyyaml>=6.0", "lxml>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ledwetter = "ledwetter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ledwetter = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["regression: comparison with stored reference outputs (tests/regression/expected)"]
